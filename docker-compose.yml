# The controller manages runner containers itself — there are no runner services
# here. Add repos/orgs from the dashboard (http://localhost:8080) and it keeps a
# warm pool of ephemeral runners for each, replacing any that crash or wedge.
#
#   cp .env.example .env   # set GITHUB_PAT (or a GitHub App) and ADMIN_PASSWORD
#   docker compose up -d --build
services:
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    image: github-runner-controller:latest
    container_name: github-runner-controller
    restart: unless-stopped
    env_file: .env
    environment:
      RUNNER_IMAGE: "${RUNNER_IMAGE:-custom-github-runner:latest}"
      SKIP_ENV_IMPORT: "${SKIP_ENV_IMPORT:-}"
    ports:
      # Localhost only by default (reach it over an SSH tunnel). Set
      # DASHBOARD_BIND=0.0.0.0 only behind a firewall / TLS reverse proxy.
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      # Controls the host Docker daemon to create runner containers and build
      # the runner image. Root-equivalent — keep the dashboard off the internet
      # or behind a reverse proxy with TLS.
      - /var/run/docker.sock:/var/run/docker.sock
      - controller-data:/data
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # Optional: publish the dashboard through a Cloudflare Tunnel (no inbound
  # ports). Set CLOUDFLARE_TUNNEL_TOKEN in .env, route a hostname to the tunnel,
  # then: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://controller:8080
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on: [controller]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  controller-data:
