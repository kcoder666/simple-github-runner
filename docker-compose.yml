# The controller manages runner containers itself — there are no runner services
# here. Add repos/orgs from the dashboard (http://localhost:8080) and it keeps a
# warm pool of ephemeral runners for each, replacing any that crash or wedge.
#
#   cp .env.example .env   # set GITHUB_PAT (or a GitHub App) and ADMIN_PASSWORD
#   docker compose up -d --build
services:
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    image: github-runner-controller:latest
    container_name: github-runner-controller
    restart: unless-stopped
    env_file: .env
    environment:
      RUNNER_IMAGE: "${RUNNER_IMAGE:-custom-github-runner:latest}"
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      # Controls the host Docker daemon to create runner containers and build
      # the runner image. Root-equivalent — keep the dashboard off the internet
      # or behind a reverse proxy with TLS.
      - /var/run/docker.sock:/var/run/docker.sock
      - controller-data:/data
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  controller-data:
