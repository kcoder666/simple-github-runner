<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runner Controller</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%232f6feb'/><path d='M5 4l6 4-6 4z' fill='white'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <h1>Runner Controller</h1>
      <p class="muted">Sign in with the admin password.</p>
      <input type="password" id="password" placeholder="Admin password" autocomplete="current-password" required autofocus>
      <button class="btn primary" type="submit">Sign in</button>
      <p id="login-error" class="error-text"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand"><span class="logo">▶</span> Runner Controller</div>
      <nav id="tabs">
        <button data-tab="overview" class="active">Overview</button>
        <button data-tab="runners">Runners</button>
        <button data-tab="targets">Targets</button>
        <button data-tab="events">Events</button>
        <button data-tab="alerts">Alerts</button>
        <button data-tab="system">System</button>
      </nav>
      <div class="topbar-right">
        <span id="heartbeat" class="pill">…</span>
        <button class="btn ghost small" id="logout">Sign out</button>
      </div>
    </header>

    <main>
      <section id="tab-overview" class="tab"></section>
      <section id="tab-runners" class="tab hidden"></section>
      <section id="tab-targets" class="tab hidden"></section>
      <section id="tab-events" class="tab hidden"></section>
      <section id="tab-alerts" class="tab hidden"></section>
      <section id="tab-system" class="tab hidden"></section>
    </main>
  </div>

  <dialog id="modal">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="btn ghost small" id="modal-close">✕</button></div>
    <div id="modal-body"></div>
  </dialog>
  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
