name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: controller/requirements-dev.txt

      - name: Unit tests
        working-directory: controller
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Lint shell scripts
        run: shellcheck runner/start.sh rebuild.sh scripts/*.sh

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: runner
          push: false
          load: true
          tags: custom-github-runner:ci
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: Verify runner binary
        run: |
          docker run --rm --entrypoint ./bin/Runner.Listener custom-github-runner:ci --version

      - name: Build controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: controller/Dockerfile
          push: false
          load: true
          tags: github-runner-controller:ci
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller

      - name: Smoke-test controller
        run: |
          docker run -d --name ctl -p 8080:8080 -e ADMIN_PASSWORD=ci \
            -v /var/run/docker.sock:/var/run/docker.sock github-runner-controller:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 2; done
          curl -fsS localhost:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/state)" = 401
          curl -fsS -H 'Authorization: Bearer ci' localhost:8080/api/state > /dev/null
          docker logs ctl
